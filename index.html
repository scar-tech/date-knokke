<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}</style>
<title>Bon pour un date</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Caveat:wght@600&display=swap">
<style>
  /* Layout : un ticket d'entrée centré sur un fond plein ; le « Non » quitte le ticket et court sur tout l'écran. */
  :root {
    --ground: #E63462;
    --ticket: #FFF0EB;
    --ink: #2A0E24;
    --muted: #7A5368;
    --line: #E2BFC6;
    --yes: #FFCB2E;
    --yes-ink: #2A0E24;
    --yes-edge: #C28F00;
    --pop: #E63462;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --hand: "Caveat", "Bradley Hand", "Segoe Script", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1C0A19;
      --ticket: #36152F;
      --ink: #FFE8EE;
      --muted: #C9A3B7;
      --line: #5E3553;
      --yes: #FFCB2E;
      --yes-ink: #2A0E24;
      --yes-edge: #A87B00;
      --pop: #FF5C8A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1C0A19;
    --ticket: #36152F;
    --ink: #FFE8EE;
    --muted: #C9A3B7;
    --line: #5E3553;
    --yes: #FFCB2E;
    --yes-ink: #2A0E24;
    --yes-edge: #A87B00;
    --pop: #FF5C8A;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    box-sizing: border-box;
    margin: 0;
    padding-inline: 16px;
    padding-block: 24px;
    display: grid;
    place-items: center;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
  }

  /* Pas de transform/filter sur le ticket ni ses enfants : le « Non » en position fixed doit rester relatif à l'écran. */
  .ticket {
    position: relative;
    box-sizing: border-box;
    width: min(100%, 26rem);
    padding: 2rem 1.75rem 1.5rem;
    background: var(--ticket);
    border-radius: 1.25rem;
    text-align: center;
  }
  .ticket section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.25rem, 10vw, 3.25rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1:focus { outline: none; }

  .perfo {
    position: relative;
    margin-inline: -1.75rem;
    margin-block: 0.5rem;
    border-top: 2px dashed var(--line);
  }
  .perfo::before,
  .perfo::after {
    content: "";
    position: absolute;
    top: calc(-0.75rem - 1px);
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    background: var(--ground);
  }
  .perfo::before { left: -0.75rem; }
  .perfo::after { right: -0.75rem; }

  .choices {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    min-height: 4.75rem;
  }
  .btn {
    font: inherit;
    font-size: 1.125rem;
    font-weight: 700;
    line-height: 1;
    padding: 0.85rem 1.75rem;
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }
  .yes {
    border: 0;
    background: var(--yes);
    color: var(--yes-ink);
    box-shadow: 0 0.3rem 0 var(--yes-edge);
  }
  .yes:active {
    translate: 0 0.2rem;
    box-shadow: 0 0.1rem 0 var(--yes-edge);
  }
  .no {
    border: 2px solid var(--ink);
    background: var(--ticket);
    color: var(--ink);
    white-space: nowrap;
  }
  .no.loose {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 5;
    margin: 0;
    transition: transform 0.24s cubic-bezier(0.3, 1.3, 0.5, 1);
  }
  .ghost {
    display: inline-block;
    visibility: hidden;
  }

  .stamp {
    align-self: center;
    margin: 0;
    padding: 0.3rem 0.9rem;
    border: 3px solid var(--pop);
    border-radius: 0.4rem;
    color: var(--pop);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    rotate: -7deg;
  }
  .confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .stamp { animation: tamponne 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes tamponne {
      from { scale: 2; opacity: 0; }
      to { scale: 1; opacity: 1; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .no.loose { transition: none; }
  }
</style>

<main class="ticket">
  <section id="question">
    <h1>Date à Knokke, chez les bourgeois</h1>
    <div class="perfo"></div>
    <div class="choices">
      <button id="oui" type="button" class="btn yes">Oui</button>
      <button id="non" type="button" class="btn no">Non</button>
    </div>
  </section>

  <section id="valide" hidden>
    <p class="stamp">Validé</p>
    <h1 tabindex="-1">Date à Knokke, chez les bourgeois</h1>
  </section>
</main>

<script>
(function () {
  const yes = document.getElementById("oui");
  const no = document.getElementById("non");
  const question = document.getElementById("question");
  const valide = document.getElementById("valide");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)");

  const pointer = { x: -9999, y: -9999 };
  let tries = 0;
  let loose = false;
  let x = 0;
  let y = 0;
  let lastFlee = 0;

  // Distance entre un point et le bord du bouton (0 si le point est dessus).
  function gap(px, py) {
    const r = no.getBoundingClientRect();
    const dx = Math.max(r.left - px, 0, px - r.right);
    const dy = Math.max(r.top - py, 0, py - r.bottom);
    return Math.hypot(dx, dy);
  }

  function place(nx, ny) {
    x = nx;
    y = ny;
    no.style.transform = "translate(" + nx + "px, " + ny + "px)";
  }

  // Sort le bouton du ticket : un fantôme garde sa place, lui passe en fixed là où il était.
  function release() {
    const r = no.getBoundingClientRect();
    const ghost = document.createElement("span");
    ghost.className = "ghost";
    ghost.style.width = r.width + "px";
    ghost.style.height = r.height + "px";
    no.before(ghost);
    no.style.transition = "none";
    no.classList.add("loose");
    place(r.left, r.top);
    no.getBoundingClientRect();
    no.style.transition = "";
    loose = true;
  }

  function flee() {
    const now = performance.now();
    if (now - lastFlee < 120) return;
    lastFlee = now;
    if (!loose) release();

    const pad = 12;
    const w = no.offsetWidth;
    const h = no.offsetHeight;
    const W = window.innerWidth;
    const H = window.innerHeight;
    const maxX = Math.max(pad, W - w - pad);
    const maxY = Math.max(pad, H - h - pad);
    const keep = yes.getBoundingClientRect();
    const wanted = Math.min(260, Math.min(W, H) * 0.4);

    let best = null;
    let bestDist = -1;
    for (let i = 0; i < 40; i++) {
      const cx = pad + Math.random() * (maxX - pad);
      const cy = pad + Math.random() * (maxY - pad);
      const onYes = cx < keep.right + 16 && cx + w > keep.left - 16 &&
                    cy < keep.bottom + 16 && cy + h > keep.top - 16;
      if (onYes) continue;
      const d = Math.hypot(cx + w / 2 - pointer.x, cy + h / 2 - pointer.y);
      if (d > bestDist) {
        bestDist = d;
        best = [cx, cy];
      }
      if (d >= wanted) break;
    }
    if (best) place(best[0], best[1]);

    tries++;
    yes.style.fontSize = (1.125 + Math.min(tries, 8) * 0.07) + "rem";
  }

  document.addEventListener("pointermove", function (e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    if (e.pointerType === "touch" || no.hidden) return;
    if (gap(e.clientX, e.clientY) < 70) flee();
  });

  // Au doigt, pas de survol : le bouton part dès que le doigt se pose dessus ou juste à côté.
  document.addEventListener("pointerdown", function (e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    if (no.hidden) return;
    if (gap(e.clientX, e.clientY) < (e.pointerType === "touch" ? 20 : 70)) flee();
  }, true);

  no.addEventListener("click", function (e) {
    e.preventDefault();
    flee();
  });
  no.addEventListener("focus", function () {
    if (no.matches(":focus-visible")) flee();
  });

  window.addEventListener("resize", function () {
    if (!loose) return;
    const maxX = Math.max(12, window.innerWidth - no.offsetWidth - 12);
    const maxY = Math.max(12, window.innerHeight - no.offsetHeight - 12);
    place(Math.min(x, maxX), Math.min(y, maxY));
  });

  yes.addEventListener("click", function () {
    no.hidden = true;
    question.hidden = true;
    valide.hidden = false;
    valide.querySelector("h1").focus();
    confetti();
  });

  function confetti() {
    if (calm.matches) return;
    const canvas = document.createElement("canvas");
    canvas.className = "confetti";
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    if (!ctx) { canvas.remove(); return; }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth;
    const H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const css = getComputedStyle(document.documentElement);
    const colors = ["--yes", "--pop", "--ink", "--ticket"].map(function (name) {
      return css.getPropertyValue(name).trim();
    });
    const bits = [];
    for (let i = 0; i < 140; i++) {
      bits.push({
        x: W / 2 + (Math.random() - 0.5) * 80,
        y: H * 0.45,
        vx: (Math.random() - 0.5) * 14,
        vy: -4 - Math.random() * 14,
        size: 5 + Math.random() * 7,
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.4,
        color: colors[i % colors.length]
      });
    }

    const start = performance.now();
    function frame(t) {
      ctx.clearRect(0, 0, W, H);
      for (const b of bits) {
        b.vy += 0.35;
        b.vx *= 0.99;
        b.x += b.vx;
        b.y += b.vy;
        b.rot += b.spin;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.size / 2, -b.size / 4, b.size, b.size / 2);
        ctx.restore();
      }
      if (t - start < 3200) requestAnimationFrame(frame);
      else canvas.remove();
    }
    requestAnimationFrame(frame);
  }
})();
</script>
